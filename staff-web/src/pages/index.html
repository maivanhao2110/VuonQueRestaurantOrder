<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff - Vườn Quê Restaurant</title>
    <link rel="stylesheet" href="../assets/css/staff.css?v=1.3">
</head>

<script>
    // Check login status
    if (!sessionStorage.getItem('staff_user')) {
        window.location.href = 'login.html';
    }
</script>

<body>
    <div class="staff-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="index.html" class="brand">
                    <span>🍽️</span> Vườn Quê Staff
                </a>
            </div>
            <ul class="sidebar-menu">
                <li>
                    <a href="index.html" class="active">
                        <span class="icon">📋</span> Đơn hàng
                    </a>
                </li>
                <li>
                    <a href="checkout.html">
                        <span class="icon">💰</span> Thanh toán
                    </a>
                </li>

            </ul>
            <div class="sidebar-footer">
                &copy; 2026 Vườn Quê Restaurant
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <h1 class="page-title">Quản lý đơn hàng</h1>
                <div class="header-actions">
                    <!-- Profile Dropdown (Original style as requested) -->
                    <div class="profile-dropdown">
                        <div id="staffName" class="staff-greeting" onclick="toggleProfileDropdown()"
                            style="cursor: pointer;">
                            Xin chào, ...
                        </div>
                        <div class="dropdown-content" id="profileDropdown">
                            <a href="#" onclick="openChangePasswordModal(event)">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                                Đổi mật khẩu
                            </a>
                            <div class="dropdown-divider"></div>
                            <a href="#" onclick="logout(event)" class="logout-link">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                                    <polyline points="16 17 21 12 16 7"></polyline>
                                    <line x1="21" y1="12" x2="9" y2="12"></line>
                                </svg>
                                Đăng xuất
                            </a>
                        </div>
                    </div>

                    <button id="btnSort" class="btn btn-header btn-sort" onclick="toggleSort()"
                        title="Sắp xếp theo thời gian">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
                            <polyline points="16 7 22 7 22 13"></polyline>
                        </svg>
                        <span id="sortLabel">Mới nhất</span>
                    </button>
                    <button class="btn btn-header btn-refresh" onclick="refreshOrders()" title="Tải lại dữ liệu">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M23 4v6h-6"></path>
                            <path d="M1 20v-6h6"></path>
                            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                        </svg>
                        <span>Làm mới</span>
                    </button>
                </div>
            </header>

            <div class="content-scrollable">
                <!-- Filter Tabs -->
                <div class="filter-tabs">
                    <button class="filter-tab active" data-status="" onclick="filterOrders('')">Tất cả</button>
                    <button class="filter-tab" data-status="CREATED" onclick="filterOrders('CREATED')">Chờ xác
                        nhận</button>
                    <button class="filter-tab" data-status="CONFIRMED" onclick="filterOrders('CONFIRMED')">Đã xác
                        nhận</button>
                    <button class="filter-tab" data-status="COOKING" onclick="filterOrders('COOKING')">Đã nấu</button>
                    <button class="filter-tab" data-status="DONE" onclick="filterOrders('DONE')">Hoàn thành</button>
                    <button class="filter-tab" data-status="SERVED" onclick="filterOrders('SERVED')">Đã phục vụ</button>
                </div>

                <!-- Orders Grid -->
                <div class="orders-grid" id="ordersGrid">
                    <!-- Orders will be loaded here -->
                    <div class="loading-container">
                        <div class="loading"></div>
                        <p>Đang tải đơn hàng...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Order Detail Modal -->
    <div id="orderDetailModal" class="modal-backdrop" style="display: none;">
        <div class="modal modal-lg">
            <div class="modal-header">
                <h3 class="modal-title" id="modalOrderTitle">Chi tiết đơn hàng</h3>
                <button class="modal-close" onclick="closeOrderModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalOrderBody">
                <!-- Order details will be loaded here -->
            </div>
            <div class="modal-footer" id="modalOrderFooter">
                <!-- Action buttons will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Payment Method Modal -->
    <div id="paymentModal" class="modal-backdrop" style="display: none; z-index: 1100;">
        <div class="modal" style="max-width: 400px;">
            <div class="modal-header">
                <h3 class="modal-title">Chọn phương thức thanh toán</h3>
                <button class="modal-close" onclick="closePaymentModal()">&times;</button>
            </div>
            <div class="modal-body">
                <p style="margin-bottom: 20px; color: #525252;">Vui lòng chọn hình thức thanh toán cho đơn hàng này:</p>
                <div style="display: grid; gap: 12px;">
                    <button class="btn btn-lg btn-success" onclick="confirmPayment('CAST')"
                        style="justify-content: center; padding: 16px;">
                        💵 Tiền mặt
                    </button>
                    <button class="btn btn-lg btn-primary" onclick="confirmPayment('BANK')"
                        style="justify-content: center; padding: 16px;">
                        🏦 Chuyển khoản
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Change Password Modal -->
    <div id="passwordModal" class="modal-backdrop" style="display: none; z-index: 1200;">
        <div class="modal" style="max-width: 400px;">
            <div class="modal-header">
                <h3 class="modal-title">Đổi mật khẩu</h3>
                <button class="modal-close" onclick="closePasswordModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="changePasswordForm" onsubmit="handleChangePassword(event)">
                    <div style="margin-bottom: 16px;">
                        <label style="display: block; margin-bottom: 8px; font-weight: 500;">Mật khẩu cũ</label>
                        <div class="password-wrapper">
                            <input type="password" id="oldPassword" required class="form-control-password">
                            <button type="button" class="btn-toggle-password"
                                onclick="togglePasswordVisibility('oldPassword')">
                                <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div style="margin-bottom: 16px;">
                        <label style="display: block; margin-bottom: 8px; font-weight: 500;">Mật khẩu mới</label>
                        <div class="password-wrapper">
                            <input type="password" id="newPassword" required class="form-control-password">
                            <button type="button" class="btn-toggle-password"
                                onclick="togglePasswordVisibility('newPassword')">
                                <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div style="margin-bottom: 24px;">
                        <label style="display: block; margin-bottom: 8px; font-weight: 500;">Xác nhận mật khẩu
                            mới</label>
                        <div class="password-wrapper">
                            <input type="password" id="confirmNewPassword" required class="form-control-password">
                            <button type="button" class="btn-toggle-password"
                                onclick="togglePasswordVisibility('confirmNewPassword')">
                                <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div style="display: flex; justify-content: flex-end; gap: 12px;">
                        <button type="button" class="btn btn-secondary" onclick="closePasswordModal()">Hủy</button>
                        <button type="submit" class="btn btn-primary">Cập nhật</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../services/staff-api.js?v=1.1"></script>
    <script src="../assets/js/orders.js?v=1.7"></script>
</body>

</html>
