<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán - Vườn Quê Restaurant</title>
    <link rel="stylesheet" href="../assets/css/staff.css?v=1.3">
    <style>
        .checkout-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .tables-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .table-card {
            background: white;
            border-radius: var(--radius-lg);
            padding: 24px;
            text-align: center;
            box-shadow: var(--shadow-md);
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .table-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--color-primary-500);
        }

        .table-card.active-selection {
            border-color: var(--color-primary-600);
            background: var(--color-primary-50);
        }

        .table-card .table-num {
            font-size: 2rem;
            font-weight: 800;
            color: var(--color-neutral-800);
            display: block;
            margin-bottom: 8px;
        }

        .table-card .order-count {
            font-size: 0.875rem;
            color: var(--color-neutral-500);
        }

        .bill-preview {
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            display: none;
            flex-direction: column;
        }

        .bill-header {
            padding: 20px 24px;
            background: var(--color-primary-600);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bill-body {
            padding: 24px;
            max-height: 500px;
            overflow-y: auto;
        }

        .bill-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px dashed var(--color-neutral-200);
        }

        .bill-footer {
            padding: 24px;
            background: var(--color-neutral-50);
            border-top: 1px solid var(--color-neutral-200);
        }

        .bill-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--color-primary-700);
            margin-bottom: 24px;
        }

        .payment-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
    </style>
</head>

<script>
    if (!sessionStorage.getItem('staff_user')) {
        window.location.href = 'login.html';
    }
</script>

<body>
    <div class="staff-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="index.html" class="brand">
                    <span>🍽️</span> Vườn Quê Staff
                </a>
            </div>
            <ul class="sidebar-menu">
                <li>
                    <a href="index.html">
                        <span class="icon">📋</span> Đơn hàng
                    </a>
                </li>
                <li>
                    <a href="checkout.html" class="active">
                        <span class="icon">💰</span> Thanh toán
                    </a>
                </li>
            </ul>
            <div class="sidebar-footer">
                &copy; 2026 Vườn Quê Restaurant
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <h1 class="page-title">Thanh toán theo bàn</h1>
                <div class="header-actions">
                    <!-- Profile Dropdown -->
                    <div class="profile-dropdown">
                        <div id="staffName" class="staff-greeting" onclick="toggleProfileDropdown()"
                            style="cursor: pointer;">
                            Xin chào, ...
                        </div>
                        <div class="dropdown-content" id="profileDropdown">
                            <a href="#" onclick="openChangePasswordModal(event)">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                                Đổi mật khẩu
                            </a>
                            <div class="dropdown-divider"></div>
                            <a href="#" onclick="logout(event)" class="logout-link">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                                    <polyline points="16 17 21 12 16 7"></polyline>
                                    <line x1="21" y1="12" x2="9" y2="12"></line>
                                </svg>
                                Đăng xuất
                            </a>
                        </div>
                    </div>

                    <button class="btn btn-header btn-refresh" onclick="loadActiveTables()" title="Tải lại dữ liệu">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M23 4v6h-6"></path>
                            <path d="M1 20v-6h6"></path>
                            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                        </svg>
                        <span>Làm mới</span>
                    </button>
                </div>
            </header>

            <div class="content-scrollable">
                <div class="checkout-container">
                    <div id="tablesLoading" class="loading-container">
                        <div class="loading"></div>
                        <p>Đang tìm các bàn cần thanh toán...</p>
                    </div>

                    <div id="noTables" class="empty-state" style="display: none;">
                        <div class="empty-icon">😌</div>
                        <p>Hiện không có bàn nào đang chờ thanh toán.</p>
                    </div>

                    <div id="tablesGrid" class="tables-grid">
                        <!-- Tables will be loaded here -->
                    </div>

                    <!-- Bill Preview -->
                    <div id="billPreview" class="bill-preview">
                        <div class="bill-header">
                            <h3 id="billTitle">Hóa đơn Bàn X</h3>
                            <button class="btn btn-sm btn-secondary" onclick="closeBill()">Đóng</button>
                        </div>
                        <div class="bill-body" id="billItems">
                            <!-- Items list -->
                        </div>
                        <div class="bill-footer">
                            <div class="bill-total">
                                <span>Tổng cộng:</span>
                                <span id="billTotalAmount">0đ</span>
                            </div>
                            <div class="payment-actions">
                                <button class="btn btn-lg btn-success" onclick="processPayment('CAST')">💵 Tiền
                                    mặt</button>
                                <button class="btn btn-lg btn-primary" onclick="processPayment('BANK')">🏦 Chuyển
                                    khoản</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Change Password Modal -->
    <div id="passwordModal" class="modal-backdrop" style="display: none; z-index: 1200;">
        <div class="modal" style="max-width: 400px;">
            <div class="modal-header">
                <h3 class="modal-title">Đổi mật khẩu</h3>
                <button class="modal-close" onclick="closePasswordModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="changePasswordForm" onsubmit="handleChangePassword(event)">
                    <div style="margin-bottom: 16px;">
                        <label style="display: block; margin-bottom: 8px; font-weight: 500;">Mật khẩu cũ</label>
                        <div class="password-wrapper">
                            <input type="password" id="oldPassword" required class="form-control-password">
                            <button type="button" class="btn-toggle-password"
                                onclick="togglePasswordVisibility('oldPassword')">
                                <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div style="margin-bottom: 16px;">
                        <label style="display: block; margin-bottom: 8px; font-weight: 500;">Mật khẩu mới</label>
                        <div class="password-wrapper">
                            <input type="password" id="newPassword" required class="form-control-password">
                            <button type="button" class="btn-toggle-password"
                                onclick="togglePasswordVisibility('newPassword')">
                                <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div style="margin-bottom: 24px;">
                        <label style="display: block; margin-bottom: 8px; font-weight: 500;">Xác nhận mật khẩu
                            mới</label>
                        <div class="password-wrapper">
                            <input type="password" id="confirmNewPassword" required class="form-control-password">
                            <button type="button" class="btn-toggle-password"
                                onclick="togglePasswordVisibility('confirmNewPassword')">
                                <svg class="eye-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div style="display: flex; justify-content: flex-end; gap: 12px;">
                        <button type="button" class="btn btn-secondary" onclick="closePasswordModal()">Hủy</button>
                        <button type="submit" class="btn btn-primary">Cập nhật</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Re-use existing services and a new checkout logic -->
    <script src="../services/staff-api.js?v=1.1"></script>
    <script src="../assets/js/checkout.js?v=1.3"></script>
</body>

</html>
