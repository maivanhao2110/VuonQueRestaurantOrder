<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Menu - Vườn Quê Restaurant">
    <meta name="theme-color" content="#22c55e">
    <title>Menu - Vườn Quê Restaurant</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../assets/css/globals.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/menu.css">
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div>
                    <h1 class="header-title"> Vườn Quê</h1>
                    <p class="header-subtitle" id="tableInfo">Đang tải...</p>
                </div>
                <button class="btn-icon" onclick="showSearchModal()" aria-label="Tìm kiếm">
                    🔍
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <!-- Category Tabs -->
            <div class="category-tabs" id="categoryTabs">
                <button class="category-tab active" data-category="all" onclick="filterByCategory('all')">
                    Tất cả
                </button>
                <!-- Categories will be loaded here -->
            </div>

            <!-- Menu Items Grid -->
            <div class="menu-grid" id="menuGrid">
                <!-- Menu items will be loaded here -->
                <div class="loading-container">
                    <div class="loading"></div>
                    <p class="text-secondary">Đang tải menu...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="menu.html" class="nav-item active">
            <span class="nav-icon">🏠</span>
            <span>Menu</span>
        </a>
        <a href="cart.html" class="nav-item">
            <span class="nav-icon">🛒</span>
            <span>Giỏ hàng</span>
            <span class="nav-badge" style="display: none;">0</span>
        </a>
        <a href="order-status.html" class="nav-item">
            <span class="nav-icon">📋</span>
            <span>Đơn hàng</span>
        </a>
    </nav>

    <!-- Add to Cart Modal -->
    <div id="addToCartModal" class="modal-backdrop hidden" style="display: none;">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="modalItemName">Tên món</h3>
            </div>
            <div class="modal-body">
                <img id="modalItemImage" src="" alt="" class="modal-item-image">
                <p id="modalItemDescription" class="text-secondary mb-md"></p>
                <p class="text-xl font-bold text-primary-600 mb-md" id="modalItemPrice">0₫</p>

                <div class="form-group">
                    <label class="form-label">Số lượng</label>
                    <div class="quantity-control">
                        <button class="quantity-btn" onclick="decreaseQuantity()">−</button>
                        <span class="quantity-value" id="modalQuantity">1</span>
                        <button class="quantity-btn" onclick="increaseQuantity()">+</button>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeAddToCartModal()">Hủy</button>
                <button class="btn btn-primary" onclick="confirmAddToCart()">Thêm vào giỏ</button>
            </div>
        </div>
    </div>

    <!-- Search Modal -->
    <div id="searchModal" class="modal-backdrop hidden">
        <div class="modal search-modal">
            <div class="modal-header">
                <h3 class="modal-title">Tìm kiếm món ăn
                    <button class="btn-close" onclick="closeSearchModal()">✕</button>
                </h3>
            </div>

            <div class="modal-body">
                <div class="search-input-group">
                    <input type="text" id="searchInput" class="search-input-field" placeholder="Nhập tên món ăn..."
                        autocomplete="off">
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn btn-primary btn-full" onclick="performSearch()">
                    Tìm kiếm
                </button>
            </div>
        </div>
    </div>


    <!-- Scripts -->
    <script src="../config/config.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../services/api.js"></script>
    <script src="../assets/js/cart.js"></script>
    <script src="../assets/js/order.js"></script>
    <script src="../assets/js/menu-page.js?v=1.2"></script>
</body>

</html>
